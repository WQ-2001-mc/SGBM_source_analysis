<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .feature { fill: #f8fafc; stroke: #111827; stroke-width: 1.5; }
      .dash { stroke: #111827; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .line { stroke: #111827; stroke-width: 1.8; fill: none; }
      .dim { stroke: #111827; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .arrowOnly { stroke: #111827; stroke-width: 1.8; marker-end: url(#arrow); }
      .label { font: 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .italic { font: italic 22px Georgia, serif; fill: #111827; }
      .side { font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; writing-mode: tb; glyph-orientation-vertical: 0; }
    </style>
  </defs>

  <rect width="980" height="380" fill="#ffffff"/>

  <!-- Image rectangles -->
  <rect x="70" y="70" width="330" height="230" class="box"/>
  <rect x="530" y="70" width="330" height="230" class="box"/>

  <text x="190" y="345" class="label">Left Image</text>
  <text x="650" y="345" class="label">Right Image</text>

  <!-- Width dimensions -->
  <line x1="70" y1="44" x2="400" y2="44" class="dim"/>
  <text x="232" y="32" class="italic">w</text>
  <line x1="530" y1="44" x2="860" y2="44" class="dim"/>
  <text x="692" y="32" class="italic">w</text>

  <!-- Height dimensions -->
  <line x1="38" y1="70" x2="38" y2="300" class="dim"/>
  <text x="16" y="190" class="italic">h</text>
  <line x1="898" y1="70" x2="898" y2="300" class="dim"/>
  <text x="918" y="190" class="italic">h</text>

  <!-- Unused pixels and D offset -->
  <line x1="70" y1="300" x2="130" y2="300" class="dim"/>
  <text x="90" y="330" class="italic">D</text>
  <text x="104" y="112" class="side">Unused Pixels</text>
  <line x1="130" y1="70" x2="130" y2="300" stroke="#111827" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- Epipolar dotted rows -->
  <line x1="130" y1="114" x2="520" y2="114" class="dash"/>
  <line x1="130" y1="220" x2="520" y2="220" class="dash"/>

  <!-- Left features -->
  <rect x="250" y="104" width="8" height="8" class="feature"/>
  <rect x="350" y="104" width="8" height="8" class="feature"/>
  <rect x="250" y="210" width="8" height="8" class="feature"/>
  <rect x="350" y="210" width="8" height="8" class="feature"/>

  <!-- Right candidate windows on row 1 -->
  <rect x="530" y="100" width="82" height="18" class="feature"/>
  <rect x="648" y="100" width="82" height="18" class="feature"/>
  <rect x="766" y="100" width="82" height="18" class="feature"/>
  <line x1="530" y1="96" x2="612" y2="96" class="dim"/>
  <line x1="648" y1="96" x2="730" y2="96" class="dim"/>
  <line x1="766" y1="96" x2="848" y2="96" class="dim"/>
  <text x="566" y="88" class="italic">D</text>
  <text x="684" y="88" class="italic">D</text>
  <text x="802" y="88" class="italic">D</text>

  <!-- Right candidate windows on row 2 -->
  <rect x="530" y="206" width="82" height="18" class="feature"/>
  <rect x="648" y="206" width="82" height="18" class="feature"/>
  <rect x="766" y="206" width="82" height="18" class="feature"/>
  <line x1="530" y1="202" x2="612" y2="202" class="dim"/>
  <line x1="648" y1="202" x2="730" y2="202" class="dim"/>
  <line x1="766" y1="202" x2="848" y2="202" class="dim"/>
  <text x="566" y="194" class="italic">D</text>
  <text x="684" y="194" class="italic">D</text>
  <text x="802" y="194" class="italic">D</text>

  <!-- Matching guides from left features to right shifted candidates -->
  <polyline points="254,112 254,158 612,158 612,118" class="line"/>
  <polyline points="354,112 354,142 730,142 730,118" class="line"/>
  <polyline points="254,218 254,264 612,264 612,224" class="line"/>
  <polyline points="354,218 354,248 730,248 730,224" class="line"/>

  <!-- Notes -->
  <text x="70" y="24" class="small">校正后同一空间点只在同一行搜索；右图候选位置相对左图向左偏移，水平偏移量即视差 D。</text>
</svg>
